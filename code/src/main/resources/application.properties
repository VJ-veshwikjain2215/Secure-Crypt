# =========================================
# SecureCrypt - Application Configuration
# =========================================

spring.application.name=SecureCrypt

# Server
server.port=${PORT:8080}
server.address=0.0.0.0

# Static resources (front-end lives in src/main/resources/static)
spring.web.resources.static-locations=classpath:/static/

# Jackson - keep JSON output readable during development
spring.jackson.serialization.indent-output=true

# File upload not used, but capped defensively
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Logging
logging.level.root=INFO
logging.level.com.securecrypt=DEBUG
