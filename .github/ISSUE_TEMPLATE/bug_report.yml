name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use the private reporting link instead. Never paste real passwords, tokens, or private messages."
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the algorithm, mode, and a small synthetic example if needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error and a redacted screenshot if useful.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, and app revision or URL
    validations:
      required: true
